<!-- Overlay: bg-black/60 = darker like your other forms -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-">
  <div class="absolute inset-0" (click)="close()"></div>

<!-- Modal: bg-white opacity-100 = solid, opacity 1 -->
<div class="relative w- max-w- mx-auto bg-white rounded-2xl flex flex-col max-h- overflow-hidden shadow-2xl border border-[#E5E5E7] opacity-100 bg-white">

  <div class="flex items-center justify-between border-b border-[#E5E5E7] px-5 py-4 shrink-0 bg-white">
    <div class="min-w-0">
      <h2 class="text- font-semibold tracking-tight text-[#1D1D1F] truncate">New Material Intake</h2>
      <p class="mt-0.5 text- text-[#6E6E73]">Record material received from a customer.</p>
    </div>
    <button type="button" (click)="close()" class="ml-3 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#F5F5F7] text-[#6E6E73]">
      <i class="bi bi-x-lg text-xs"></i>
    </button>
  </div>

  <form [formGroup]="materialIntakeForm" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden bg-white">
    
    <div class="flex-1 overflow-y-auto space-y-4 p-4 bg-white">

      <div>
        <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Customer</label>
        <select formControlName="customerId" (change)="onCustomerChange()" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none focus:border-[#B89E65]">
          <option value="">Select a customer</option>
          @for (customer of customerList(); track customer.id) {
            <option [value]="customer.id">{{ customer.name }}</option>
          }
        </select>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Material Type</label>
          <select formControlName="materialType" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none focus:border-[#B89E65]">
            <option value="Mixed Ore">Raw</option>
          </select>
        </div>
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Date</label>
          <input type="date" formControlName="date" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none focus:border-[#B89E65]">
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Quantity</label>
          <input type="number" formControlName="quantity" min="1" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none focus:border-[#B89E65]">
        </div>
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Unit</label>
          <select formControlName="unit" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none focus:border-[#B89E65]">
            <option value="bags">Bags</option>
            <option value="kg">Kilograms</option>
            <option value="tons">Tons</option>
          </select>
        </div>
      </div>

      <div>
        <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Notes</label>
        <textarea formControlName="notes" rows="2" placeholder="Optional notes..." class="w-full resize-none rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- text-[#1D1D1F] outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]"></textarea>
      </div>

      @if (errorMessage) {
        <div class="rounded-xl bg-red-50 px-3 py-2.5 text- text-red-700">{{ errorMessage }}</div>
      }
    </div>

    <div class="flex gap-2.5 border-t border-[#E5E5E7] p-3 bg-white shrink-0">
      <button type="button" (click)="close()" class="flex-1 rounded-full border border-[#E5E5E7] bg-white py-2.5 text- font-medium text-[#1D1D1F] hover:bg-[#F5F5F7]">Cancel</button>
      <button type="submit" [disabled]="loading" class="flex-1 rounded-full bg-[#1D1D1F] py-2.5 text- font-medium text-white hover:bg-[#333] disabled:opacity-50">{{ loading ? 'Saving...' : 'Save Intake' }}</button>
    </div>

  </form>
</div>
</div>
