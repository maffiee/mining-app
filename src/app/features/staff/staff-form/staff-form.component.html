<div class="w- max-w- mx-auto bg-white rounded-2xl flex flex-col max-h- overflow-hidden shadow-xl border border-[#E5E5E7]">

  <!-- HEADER -->
  <div class="flex items-start justify-between border-b border-[#E5E5E7] px-5 py-4 shrink-0 bg-white">
    <div class="min-w-0">
      <h2 class="text- font-semibold tracking-tight text-[#1D1D1F]">Add Staff Profile</h2>
      <p class="text- text-[#6E6E73]">Add a staff member for the tin-shed.</p>
    </div>
    <button type="button" (click)="close()" class="flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#F5F5F7] text-[#6E6E73] hover:bg-[#E5E5E7]">
      <i class="bi bi-x-lg text-xs"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden bg-white">
    <div class="flex-1 overflow-y-auto space-y-4 p-4">

      <div>
        <h3 class="text- font-semibold text-[#1D1D1F] uppercase tracking-wide">Personal Information</h3>
        <div class="mt-2.5 space-y-3">
          <div>
            <label class="mb-1 block text- font-medium">Full Name <span class="text-red-500">*</span></label>
            <input type="text" formControlName="fullName" placeholder="John Musa" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65] focus:ring-2 focus:ring-[#B89E65]/10" />
          </div>

          <div class="grid grid-cols-2 gap-2.5">
            <div>
              <label class="mb-1 block text- font-medium">Role <span class="text-red-500">*</span></label>
              <select formControlName="role" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- outline-none focus:border-[#B89E65]">
                <option value="manager">Manager</option>
                <option value="processor">Processor</option>
                <option value="security">Security</option>
                <option value="driver">Driver</option>
                <option value="accountant">Accountant</option>
                <option value="other">Other</option>
              </select>
            </div>
            <div>
              <label class="mb-1 block text- font-medium">Phone</label>
              <input type="tel" formControlName="phone" placeholder="0803..." class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]" />
            </div>
          </div>
        </div>
      </div>

      <div>
        <h3 class="text- font-semibold text-[#1D1D1F] uppercase tracking-wide">Employment Details</h3>
        <div class="mt-2.5 grid grid-cols-2 gap-2.5">
          <div>
            <label class="mb-1 block text- font-medium">Monthly Salary <span class="text-red-500">*</span></label>
            <div class="relative">
              <span class="absolute left-3 top-1/2 -translate-y-1/2 text- text-[#6E6E73]">₦</span>
              <input type="number" formControlName="salaryAmount" placeholder="80000" class="w-full rounded-xl border border-[#E5E5E7] bg-white py-2.5 pl-7 pr-3 text- outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]" />
            </div>
          </div>
          <div>
            <label class="mb-1 block text- font-medium">Employment Date</label>
            <input type="date" formControlName="employmentDate" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- outline-none focus:border-[#B89E65]" />
          </div>
        </div>
      </div>

    </div>

    <div class="flex gap-2.5 border-t border-[#E5E5E7] p-3 bg-white shrink-0">
      <button type="button" (click)="close()" class="flex-1 rounded-full border border-[#E5E5E7] bg-white py-2.5 text- font-medium hover:bg-[#F5F5F7]">Cancel</button>
      <button type="submit" [disabled]="loading" class="flex-1 rounded-full bg-[#1D1D1F] py-2.5 text- font-medium text-white hover:bg-[#333] disabled:opacity-50">
        <span class="flex items-center justify-center gap-1.5">
          @if (loading) { <i class="bi bi-arrow-repeat animate-spin text-xs"></i> Saving... }
          @else { <i class="bi bi-check2 text-xs"></i> Save Staff }
        </span>
      </button>
    </div>
  </form>
</div>
