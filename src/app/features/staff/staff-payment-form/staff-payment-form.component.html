<!-- WRAPPER - NO BLACK BACKGROUND -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-transparent">

  <!-- MODAL - YOUR PAY SALARY FORM -->
  <div class="w- max-w- bg-white rounded-2xl shadow-xl border border-[#E5E5E7] flex flex-col max-h- overflow-hidden">
    
    <!-- HEADER -->
    <div class="flex items-start justify-between px-5 py-4 border-b border-[#E5E5E7] shrink-0">
      <div class="min-w-0">
        <h2 class="text- font-semibold text-[#1D1D1F]">Pay Salary</h2>
        <p class="text- text-[#6E6E73] truncate">John · Processor · ₦22,000/mo</p>
      </div>
      <button type="button" (click)="close()" class="h-7 w-7 rounded-full bg-[#F5F5F7] flex items-center justify-center">
        <i class="bi bi-x-lg text-"></i>
      </button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden">
      <div class="flex-1 overflow-y-auto space-y-4 p-4">

        <div class="rounded-xl border bg-[#F9F9F9] px-4 py-3 flex justify-between items-center">
          <div><p class="text- uppercase text-[#6E6E73]">STAFF</p><p class="text-sm font-semibold">John</p></div>
          <div class="text-right"><p class="text- text-[#6E6E73]">Monthly</p><p class="text- font-bold">₦22,000</p></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div><label class="mb-1 block text- font-medium">Month *</label><input type="month" formControlName="paymentMonth" class="w-full rounded-xl border px-3 py-2.5 text-sm bg-white" /></div>
          <div><label class="mb-1 block text- font-medium">Payment Date *</label><input type="date" formControlName="paymentDate" class="w-full rounded-xl border px-3 py-2.5 text-sm bg-white" /></div>
        </div>

        <div class="grid grid-cols-2 gap-3">
          <div><label class="mb-1 block text- font-medium">Payment Type</label><select formControlName="paymentType" class="w-full rounded-xl border px-3 py-2.5 text-sm bg-white"><option>Monthly Salary</option></select></div>
          <div><label class="mb-1 block text- font-medium">Amount *</label><div class="relative"><span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs">₦</span><input type="number" formControlName="amount" class="w-full rounded-xl border py-2.5 pl-7 pr-3 text-sm bg-white" /></div></div>
        </div>

        <div><label class="mb-1 block text- font-medium">Note</label><input type="text" formControlName="description" class="w-full rounded-xl border px-3 py-2.5 text-sm bg-white" /></div>
      </div>

      <div class="flex gap-3 border-t p-4 bg-white">
        <button type="button" (click)="close()" class="flex-1 rounded-full py-2.5 text-sm">Cancel</button>
        <button type="submit" class="flex-1 rounded-full bg-[#1D1D1F] py-2.5 text-sm text-white">Confirm Payment</button>
      </div>
    </form>
  </div>
</div>
