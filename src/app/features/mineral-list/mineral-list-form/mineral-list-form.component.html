<!-- Overlay -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
  <div class="absolute inset-0" (click)="close()"></div>

  <!-- Modal: SMALL -->
  <div class="relative w-full max-w-md bg-white rounded-xl flex flex-col overflow-hidden shadow-2xl border border-[#E5E5E7]">

    <div class="flex items-center justify-between border-b border-[#E5E5E7] px-4 py-3 shrink-0 bg-white">
      <div>
        <h2 class="text- font-semibold text-[#1D1D1F]">{{ isEditMode ? 'Edit Mineral' : 'Add Mineral' }}</h2>
        <p class="text- text-[#6E6E73]">{{ isEditMode ? 'Update details' : 'Enter mineral details' }}</p>
      </div>
      <button type="button" (click)="close()" class="flex h-6 w-6 items-center justify-center rounded-full bg-[#F5F5F7]"><i class="bi bi-x-lg text-"></i></button>
    </div>

    <form [formGroup]="form" (ngSubmit)="save()" class="bg-white">
      <div class="space-y-3 p-4">
        <div>
          <label class="mb-1 block text- font-medium text-[#1D1D1F]">Mineral Name</label>
          <input type="text" formControlName="name" placeholder="Gold" class="w-full rounded-lg border border-[#E5E5E7] bg-white px-3 py-2 text- outline-none focus:border-[#B89E65]" />
        </div>
        <div>
          <label class="mb-1 block text- font-medium text-[#1D1D1F]">Price (₦)</label>
          <input type="number" formControlName="price" placeholder="50000" class="w-full rounded-lg border border-[#E5E5E7] bg-white px-3 py-2 text- outline-none focus:border-[#B89E65]" />
        </div>

        @if (errorMessage) {
          <div class="rounded-lg bg-red-50 px-3 py-2 text- text-red-700">{{ errorMessage }}</div>
        }
      </div>

      <div class="flex justify-end gap-2 border-t border-[#E5E5E7] p-3 bg-white">
        <button type="button" (click)="close()" class="rounded-full border border-[#E5E5E7] bg-white px-4 py-1.5 text- font-medium">Cancel</button>
        <button type="submit" [disabled]="loading" class="rounded-full bg-[#1D1D1F] px-4 py-1.5 text- font-medium text-white disabled:opacity-50">
          {{ loading ? 'Saving...' : isEditMode ? 'Update' : 'Save' }}
        </button>
      </div>
    </form>
  </div>
</div>
