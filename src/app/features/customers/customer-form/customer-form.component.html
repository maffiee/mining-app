<!-- Overlay: bg-black/60 = darker like your other forms -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-">
  <div class="absolute inset-0" (click)="close()"></div>

<!-- Modal: bg-white opacity-100 = solid, opacity 1 -->
<div class="relative w- max-w- bg-white rounded-2xl flex flex-col max-h- overflow-hidden shadow-2xl border border-[#E5E5E7] opacity-100">

  <div class="flex items-center justify-between border-b border-[#E5E5E7] px-5 py-4 shrink-0 bg-white">
    <div class="min-w-0">
      <h2 class="text- sm:text- font-semibold tracking-tight text-[#1D1D1F] truncate">{{ isEditMode ? 'Edit Customer' : 'Add Customer' }}</h2>
      <p class="mt-0.5 text- sm:text- text-[#6E6E73]">Enter the customer's details.</p>
    </div>
    <button type="button" (click)="close()" class="ml-3 flex h-7 w-7 shrink-0 items-center justify-center rounded-full bg-[#F5F5F7] text-[#6E6E73]"><i class="bi bi-x-lg text-xs"></i></button>
  </div>

  <form [formGroup]="customerForm" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden bg-white">
    <div class="flex-1 overflow-y-auto space-y-4 p-4 sm:p-5 bg-white">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="sm:col-span-2">
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Customer Name</label>
          <input type="text" formControlName="name" placeholder="Enter customer name" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3.5 py-2.5 text- text-[#1D1D1F] outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]" />
        </div>
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Phone Number</label>
          <input type="tel" formControlName="phone" placeholder="Enter phone number" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3.5 py-2.5 text- text-[#1D1D1F] outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]" />
        </div>
        <div>
          <label class="mb-1.5 block text- font-medium text-[#1D1D1F]">Address</label>
          <input type="text" formControlName="address" placeholder="Enter address" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3.5 py-2.5 text- text-[#1D1D1F] outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65]" />
        </div>
      </div>

      @if (errorMessage) {
        <div class="rounded-xl bg-red-50 px-3.5 py-2.5 text- text-red-700">{{ errorMessage }}</div>
      }
    </div>

    <div class="flex flex-col-reverse sm:flex-row sm:justify-end gap-2.5 border-t border-[#E5E5E7] p-3 bg-white shrink-0">
      <button type="button" (click)="close()" class="w-full sm:w-auto rounded-full border border-[#E5E5E7] bg-white px-5 py-2.5 text- font-medium text-[#1D1D1F] hover:bg-[#F5F5F7]">Cancel</button>
      <button type="submit" [disabled]="loading" class="w-full sm:w-auto rounded-full bg-[#1D1D1F] px-5 py-2.5 text- font-medium text-white hover:bg-[#333] disabled:opacity-50">
        @if (loading) { <span class="flex items-center justify-center gap-2"><i class="bi bi-arrow-repeat animate-spin"></i>Saving...</span> } @else { {{ isEditMode ? 'Update Customer' : 'Save Customer' }} }
      </button>
    </div>
  </form>
</div>
</div>
