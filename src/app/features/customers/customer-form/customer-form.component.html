
<div class="w-full bg-white">

  <!-- Header -->
  <div class="flex items-center justify-between border-b border-[#E5E5E7] px-6 py-5">

    <div>
      <h2 class="text-xl font-semibold tracking-tight text-[#1D1D1F]">
        {{ isEditMode ? 'Edit Customer' : 'Add Customer' }}
      </h2>

      <p class="mt-1 text-sm text-[#6E6E73]">
        Enter the customer's details.
      </p>
    </div>

    <button
      type="button"
      (click)="close()"
      class="flex h-9 w-9 items-center justify-center rounded-full
             text-[#6E6E73] transition-colors
             hover:bg-[#F5F5F7] hover:text-[#1D1D1F]"
    >
      <i class="bi bi-x-lg text-sm"></i>
    </button>

  </div>


  <!-- Form -->
  <form
    [formGroup]="customerForm"
    (ngSubmit)="save()"
    class="space-y-6 p-6"
  >

    <!-- Name -->
    <div>

      <label class="mb-2 block text-sm font-medium text-[#1D1D1F]">
        Customer Name
      </label>

      <input
        type="text"
        formControlName="name"
        placeholder="Enter customer name"
        class="w-full rounded-xl border border-[#E5E5E7] bg-white
               px-4 py-3 text-sm text-[#1D1D1F]
               outline-none transition
               placeholder:text-[#6E6E73]
               focus:border-[#B89E65]
               focus:ring-2 focus:ring-[#B89E65]/10"
      >

    </div>


    <!-- Phone -->
    <div>

      <label class="mb-2 block text-sm font-medium text-[#1D1D1F]">
        Phone Number
      </label>

      <input
        type="tel"
        formControlName="phone"
        placeholder="Enter phone number"
        class="w-full rounded-xl border border-[#E5E5E7] bg-white
               px-4 py-3 text-sm text-[#1D1D1F]
               outline-none transition
               placeholder:text-[#6E6E73]
               focus:border-[#B89E65]
               focus:ring-2 focus:ring-[#B89E65]/10"
      >

    </div>


    <!-- Address -->
    <div>

      <label class="mb-2 block text-sm font-medium text-[#1D1D1F]">
        Address
      </label>

      <input
        type="text"
        formControlName="address"
        placeholder="Enter address"
        class="w-full rounded-xl border border-[#E5E5E7] bg-white
               px-4 py-3 text-sm text-[#1D1D1F]
               outline-none transition
               placeholder:text-[#6E6E73]
               focus:border-[#B89E65]
               focus:ring-2 focus:ring-[#B89E65]/10"
      >

    </div>


    <!-- Error -->
    @if (errorMessage) {

      <div class="rounded-xl bg-red-50 px-4 py-3">
        <p class="text-sm text-red-700">
          {{ errorMessage }}
        </p>
      </div>

    }


    <!-- Actions -->
    <div class="flex justify-end gap-3 border-t border-[#E5E5E7] pt-5">

      <button
        type="button"
        (click)="close()"
        class="rounded-full border border-[#E5E5E7] bg-white
               px-5 py-2.5 text-sm font-medium text-[#1D1D1F]
               transition-colors hover:bg-[#F5F5F7]"
      >
        Cancel
      </button>

      <button
        type="submit"
        [disabled]="loading"
        class="rounded-full bg-[#1D1D1F] px-5 py-2.5
               text-sm font-medium text-white
               transition-colors hover:bg-[#333336]
               disabled:cursor-not-allowed disabled:opacity-50"
      >

        @if (loading) {

          <span class="flex items-center gap-2">
            <i class="bi bi-arrow-repeat animate-spin"></i>
            Saving...
          </span>

        } @else {

          {{ isEditMode ? 'Update Customer' : 'Save Customer' }}

        }

      </button>

    </div>

  </form>

</div>
