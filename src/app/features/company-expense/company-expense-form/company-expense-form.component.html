<div class="w- max-w- mx-auto bg-white rounded-2xl flex flex-col max-h- overflow-hidden shadow-2xl">

  <!-- HEADER -->
  <div class="flex items-start justify-between border-b border-[#E5E5E7] px-5 py-4 shrink-0">
    <div class="min-w-0">
      <h2 class="text- font-semibold tracking-tight text-[#1D1D1F] truncate">{{ isEdit? 'Edit Shed Expense' : 'Add Shed Expense' }}</h2>
      <p class="text- text-[#6E6E73]">Diesel, repairs, electricity, labor.</p>
    </div>
    <button type="button" (click)="close()" class="flex h-8 w-8 shrink-0 items-center justify-center rounded-full bg-[#F5F5F7] text-[#6E6E73] hover:bg-[#E5E5E7]">
      <i class="bi bi-x-lg text-sm"></i>
    </button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden">
    <div class="flex-1 overflow-y-auto space-y-4 p-5">

      <div class="grid grid-cols-2 gap-3">
        <div>
          <label class="mb-1 block text-xs font-medium text-[#1D1D1F]">Category</label>
          <select formControlName="category" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#B89E65] focus:ring-2 focus:ring-[#B89E65]/10">
            <option value="diesel">Diesel / Fuel</option>
            <option value="electricity">Electricity (JED)</option>
            <option value="repairs">Repairs</option>
            <option value="labor">Labor / Boys</option>
            <option value="rent">Rent</option>
            <option value="other">Other</option>
          </select>
        </div>
        <div>
          <label class="mb-1 block text-xs font-medium text-[#1D1D1F]">Amount</label>
          <div class="relative">
            <span class="absolute left-3 top-1/2 -translate-y-1/2 text-xs text-[#6E6E73]">₦</span>
            <input type="number" formControlName="amount" placeholder="50000" class="w-full rounded-xl border border-[#E5E5E7] bg-white py-2.5 pl-7 pr-3 text-sm outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65] focus:ring-2 focus:ring-[#B89E65]/10" />
          </div>
        </div>
      </div>

      <div>
        <label class="mb-1 block text-xs font-medium text-[#1D1D1F]">Description</label>
        <input type="text" formControlName="description" placeholder="50L diesel / Fixed mill" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text-sm outline-none placeholder:text-[#6E6E73] focus:border-[#B89E65] focus:ring-2 focus:ring-[#B89E65]/10" />
      </div>

      <div>
        <label class="mb-1 block text-xs font-medium text-[#1D1D1F]">Expense Date</label>
        <input type="date" formControlName="expenseDate" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text-sm outline-none focus:border-[#B89E65] focus:ring-2 focus:ring-[#B89E65]/10" />
      </div>

    </div>

    <div class="flex gap-2.5 border-t border-[#E5E5E7] p-4 bg-white shrink-0">
      <button type="button" (click)="close()" class="flex-1 rounded-full border border-[#E5E5E7] bg-white py-2.5 text-sm font-medium hover:bg-[#F5F5F7]">Cancel</button>
      <button type="submit" [disabled]="loading" class="flex-1 rounded-full bg-[#1D1D1F] py-2.5 text-sm font-medium text-white hover:bg-[#333336] disabled:opacity-50">
        <span class="flex items-center justify-center gap-1.5">
          @if (loading) { <i class="bi bi-arrow-repeat animate-spin"></i> Saving... }
          @else { <i class="bi bi-check2"></i> {{ isEdit? 'Update Expense' : 'Save Expense' }} }
        </span>
      </button>
    </div>
  </form>
</div>
