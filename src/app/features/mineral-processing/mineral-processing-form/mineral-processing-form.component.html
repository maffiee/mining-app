<!-- Overlay: bg-black/60 = darker like your other forms -->
<div class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-">
  <div class="absolute inset-0" (click)="close()"></div>

<!-- Modal: bg-white opacity-100 = solid, opacity 1 -->
<div class="relative w- max-w- mx-auto bg-white rounded-2xl flex flex-col max-h- overflow-hidden shadow-2xl border border-[#E5E5E7] opacity-100 bg-white">

  <div class="flex items-center justify-between border-b border-[#E5E5E7] px-5 py-4 shrink-0 bg-white">
    <div>
      <h2 class="text- font-semibold text-[#1D1D1F]">Mineral Processing</h2>
      <p class="text- text-[#6E6E73]">Record minerals recovered.</p>
    </div>
    <button type="button" (click)="close()" class="h-7 w-7 rounded-full bg-[#F5F5F7] hover:bg-[#E5E5E7] flex items-center justify-center"><i class="bi bi-x-lg text-xs"></i></button>
  </div>

  <form [formGroup]="form" (ngSubmit)="save()" class="flex flex-col flex-1 overflow-hidden bg-white">
    <div class="flex-1 overflow-y-auto space-y-4 p-4 bg-white">

      <div>
        <label class="mb-1.5 block text- font-medium">Customer</label>
        <select formControlName="customerId" (change)="onCustomerChange($any($event.target).value)" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- outline-none focus:border-[#B89E65]">
          <option value="" disabled>Select customer</option>
          @for (customer of pendingCustomers(); track customer.id) {
            <option [value]="customer.id">{{ customer.name }}</option>
          }
        </select>
      </div>

      <div class="border-t border-[#E5E5E7] pt-4">
        <h3 class="mb-3 text- font-semibold uppercase tracking-wide">Material Processed</h3>
        <div class="grid grid-cols-2 gap-2.5">
          <div>
            <label class="mb-1.5 block text-">Material</label>
            <input type="text" formControlName="inputMaterial" readonly class="w-full rounded-xl border border-[#E5E5E7] bg-[#F5F5F7] px-3 py-2.5 text- text-[#1D1D1F]" />
          </div>
          <div>
            <label class="mb-1.5 block text-">Quantity</label>
            <input type="number" formControlName="inputQuantity" readonly class="w-full rounded-xl border border-[#E5E5E7] bg-[#F5F5F7] px-3 py-2.5 text- text-[#1D1D1F]" />
          </div>
        </div>
      </div>

      <div class="border-t border-[#E5E5E7] pt-4">
        <h3 class="mb-3 text- font-semibold uppercase tracking-wide">Minerals Recovered</h3>
        <div class="grid grid-cols-3 gap-2">
          <div>
            <label class="mb-1 block text- font-medium">Monazite (kg)</label>
            <input type="number" formControlName="monaziteQuantity" class="w-full rounded-lg border border-[#E5E5E7] bg-white px-2.5 py-2.5 text- outline-none focus:border-[#B89E65]" placeholder="0" />
          </div>
          <div>
            <label class="mb-1 block text- font-medium">Zircon (kg)</label>
            <input type="number" formControlName="zirconQuantity" class="w-full rounded-lg border border-[#E5E5E7] bg-white px-2.5 py-2.5 text- outline-none focus:border-[#B89E65]" placeholder="0" />
          </div>
          <div>
            <label class="mb-1 block text- font-medium">Iron (kg)</label>
            <input type="number" formControlName="ironQuantity" class="w-full rounded-lg border border-[#E5E5E7] bg-white px-2.5 py-2.5 text- outline-none focus:border-[#B89E65]" placeholder="0" />
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2.5">
        <div>
          <label class="mb-1.5 block text-">Processing Date</label>
          <input type="date" formControlName="date" class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text-" />
        </div>
        <div>
          <label class="mb-1.5 block text-">Notes</label>
          <textarea formControlName="notes" rows="2" placeholder="Optional..." class="w-full rounded-xl border border-[#E5E5E7] bg-white px-3 py-2.5 text- resize-none"></textarea>
        </div>
      </div>

    </div>

    <div class="flex gap-2.5 border-t border-[#E5E5E7] p-3 bg-white shrink-0">
      <button type="button" (click)="close()" class="flex-1 rounded-full border border-[#E5E5E7] bg-white py-2.5 text- font-medium">Cancel</button>
      <button type="submit" class="flex-1 rounded-full bg-[#1D1D1F] py-2.5 text- font-medium text-white">Save</button>
    </div>
  </form>
</div>
</div>
