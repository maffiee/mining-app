
<header
  class="flex h-16 items-center justify-between
         border-b border-[#E5E5E7] bg-white px-6"
>

  <!-- Page context -->
  <div class="flex items-center gap-3">

    <ion-menu-button
      menu="main-navigation"
      class="md:hidden"
      aria-label="Open navigation menu"
    ></ion-menu-button>

    <div>
      <p class="text-sm font-semibold tracking-tight text-[#1D1D1F]">
        Mining Operations
      </p>

      <p class="mt-0.5 text-xs text-[#6E6E73]">
        Management dashboard
      </p>
    </div>

  </div>


  <!-- User -->
  <div class="flex items-center gap-3">

    <div class="hidden text-right sm:block">
      <p class="text-sm font-medium text-[#1D1D1F]">
        Administrator
      </p>

      @if (user(); as currentUser) {
        <p class="mt-0.5 max-w-[220px] truncate text-xs text-[#6E6E73]">
          {{ currentUser.email }}
        </p>
      }
    </div>

    <!-- Avatar -->
    <div
      class="flex h-9 w-9 items-center justify-center
             rounded-full bg-[#F5F5F7]
             text-sm font-semibold text-[#1D1D1F]
             ring-1 ring-[#E5E5E7]"
    >
      A
    </div>

  </div>

</header>
