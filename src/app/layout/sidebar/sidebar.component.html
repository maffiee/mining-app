
<nav class="flex h-full w-full max-h-screen flex-col overflow-hidden border-r border-[#E5E5E7] bg-white p-4 text-[#1D1D1F]">

  <!-- Brand -->
  <div class="mb-8 px-3 pt-1">
    <h1 class="text-lg font-semibold tracking-tight text-[#1D1D1F]">
      Mining App
    </h1>

    <p class="mt-1 text-xs text-[#6E6E73]">
      Management System
    </p>
  </div>

  <!-- Navigation -->
  <div class="flex flex-1 flex-col gap-1 overflow-y-auto overflow-x-hidden pr-1">

    @for (item of navItems; track item.route) {

      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#F5F5F7] text-[#1D1D1F]"
        [routerLinkActiveOptions]="{ exact: true }"
        class="group flex items-center gap-3 rounded-xl px-3 py-2.5
               text-sm font-medium text-[#6E6E73]
               transition-all duration-200
               hover:bg-[#F5F5F7] hover:text-[#1D1D1F]"
      >

        <!-- Active indicator -->
        <span
          class="h-5 w-0.5 rounded-full bg-[#B89E65]
                 opacity-0 transition-opacity
                 group-[.bg-[#F5F5F7]]:opacity-100"
        ></span>

        <i
          [class]="item.icon"
          class="text-[15px]"
        ></i>

        <span>
          {{ item.label }}
        </span>

      </a>

    }

  </div>

  <!-- Logout -->
  <button
    type="button"
    (click)="logout()"
    class="mt-3 flex items-center gap-3 rounded-xl px-3 py-2.5
           text-sm font-medium text-[#6E6E73]
           transition-colors
           hover:bg-[#F5F5F7] hover:text-[#1D1D1F]"
  >
    <i class="bi bi-box-arrow-right text-[15px]"></i>

    <span>
      Logout
    </span>
  </button>

</nav>
